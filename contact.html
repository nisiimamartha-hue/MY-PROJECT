<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelCraft Studios - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>PixelCraft Studios</h1>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>Fill out the form below to discuss your upcoming website project with our team.</p>

            <form action="#" method="post">
                <p>
                    <label for="full-name">Full Name:</label><br>
                    <input type="text" id="full-name" name="full_name" required>
                </p>

                <p>
                    <label for="email-address">Email Address:</label><br>
                    <input type="email" id="email-address" name="email_address" required>
                </p>

                <p>
                    <label for="service-select">Service Needed:</label><br>
                    <select id="service-select" name="service_needed">
                        <option value="web-design">Custom Web Design</option>
                        <option value="development">Semantic Development</option>
                        <option value="consulting">General Consulting</option>
                    </select>
                </p>

                <p>
                    <label for="user-message">Project Details:</label><br>
                    <textarea id="user-message" name="user_message" rows="5" cols="30" required></textarea>
                </p>

                <p>
                    <button type="submit">Send Message</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PixelCraft Studios. All rights reserved.</p>
    </footer>

</body>
</html>
